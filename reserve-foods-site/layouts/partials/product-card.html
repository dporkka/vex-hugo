<section class="section">
  <h2>Reserve Bar</h2>
  <p>Precision macros, stable shelf profile, and practical ingredients designed for real-world readiness.</p>
  {{ with resources.Get "images/reserve-bar.webp" }}
    {{ $small := .Resize "480x webp" }}
    {{ $large := .Resize "960x webp" }}
    <img src="{{ $large.RelPermalink }}" srcset="{{ $small.RelPermalink }} 480w, {{ $large.RelPermalink }} 960w" sizes="(max-width: 700px) 100vw, 960px" alt="Reserve Bar" loading="lazy" width="{{ $large.Width }}" height="{{ $large.Height }}">
  {{ end }}
</section>
